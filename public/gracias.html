<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gracias por tu compra</title>
<meta name="theme-color" content="#2b1d14" />
<style>
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: linear-gradient(180deg, #2b1d14 0%, #3a281c 100%);
    color: #231d18;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }
  .card {
    max-width: 520px;
    width: 100%;
    background: #fff;
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,.35);
  }
  .check {
    width: 64px; height: 64px; border-radius: 50%;
    background: #2b1d14; color: #c9a46a;
    display: grid; place-items: center;
    font-size: 1.8rem; margin: 0 auto 18px;
  }
  h1 { font-family: var(--serif); margin: 0 0 12px; font-size: 1.7rem; font-weight: 600; }
  p { color: #6b6258; margin: 0 0 12px; }
  .order-box { margin: 20px 0 6px; padding: 14px; background: #f5eee4; border-radius: 10px; font-size: .9rem; color: #6b6258; }
  .order-id { font-family: ui-monospace, Menlo, Consolas, monospace; color: #231d18; font-weight: 600; display: block; margin-top: 4px; word-break: break-all; }
  a.back {
    display: inline-block; margin-top: 18px; text-decoration: none;
    background: #2b1d14; color: #fff; padding: 12px 24px; border-radius: 10px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>¡Gracias por tu preventa!</h1>
    <p>Tu pedido quedó registrado. Te llegará un correo con la confirmación una vez que se valide el pago.</p>
    <p>Si elegiste retiro, te contactaremos por WhatsApp o correo para coordinar el día y la hora.</p>
    <div class="order-box hidden-box" id="orderBox" hidden>
      N° de pedido
      <span class="order-id" id="orderId"></span>
    </div>
    <a class="back" href="/">Volver al inicio</a>
  </div>
  <script>
    const orderId = new URLSearchParams(window.location.search).get('orderId');
    if (orderId) {
      document.getElementById('orderId').textContent = orderId;
      document.getElementById('orderBox').hidden = false;
    }
  </script>
</body>
</html>
