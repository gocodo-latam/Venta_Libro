<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gracias por tu compra</title>
<meta name="theme-color" content="#2b1d14" />
<style>
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: linear-gradient(180deg, #2b1d14 0%, #3a281c 100%);
    color: #231d18;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }
  .card {
    max-width: 520px;
    width: 100%;
    background: #fff;
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,.35);
  }
  .check {
    width: 64px; height: 64px; border-radius: 50%;
    background: #2b1d14; color: #c9a46a;
    display: grid; place-items: center;
    font-size: 1.8rem; margin: 0 auto 18px;
  }
  h1 { font-family: var(--serif); margin: 0 0 12px; font-size: 1.7rem; font-weight: 600; }
  p { color: #6b6258; margin: 0 0 12px; }
  .order-box { margin: 20px 0 6px; padding: 14px; background: #f5eee4; border-radius: 10px; font-size: .9rem; color: #6b6258; }
  .order-id { font-family: ui-monospace, Menlo, Consolas, monospace; color: #231d18; font-weight: 600; display: block; margin-top: 4px; word-break: break-all; }
  a.back {
    display: inline-block; margin-top: 18px; text-decoration: none;
    background: #2b1d14; color: #fff; padding: 12px 24px; border-radius: 10px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check" id="icon" aria-hidden="true">✓</div>
    <h1 id="title">¡Gracias por tu preventa!</h1>
    <p id="msg1">Tu pedido quedó registrado. Te llegará un correo con la confirmación una vez que se valide el pago.</p>
    <p id="msg2">Si elegiste retiro, te contactaremos por WhatsApp o correo para coordinar el día y la hora.</p>
    <div class="order-box" id="orderBox" hidden>
      N° de pedido
      <span class="order-id" id="orderId"></span>
    </div>
    <a class="back" id="backBtn" href="/">Volver al inicio</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const estado = params.get('estado') || 'pagado';
    const $ = (id) => document.getElementById(id);

    const textos = {
      pagado: null, // texto por defecto del HTML
      pendiente: {
        icon: '⏳', title: 'Estamos validando tu pago',
        m1: 'Tu pago aún está en proceso. No es necesario que vuelvas a pagar: cuando se confirme, tu pedido quedará registrado automáticamente.',
        m2: 'Si en unos minutos no recibes el correo de Flow, escríbenos con tu N° de pedido.'
      },
      rechazado: {
        icon: '!', title: 'No pudimos procesar tu pago',
        m1: 'El pago fue rechazado y no se realizó ningún cobro. Puedes intentarlo de nuevo con la misma u otra tarjeta.',
        m2: '', retry: true
      },
      anulado: {
        icon: '!', title: 'El pago fue cancelado',
        m1: 'Cancelaste el pago y no se realizó ningún cobro. Si quieres reservar tu ejemplar, puedes intentarlo de nuevo.',
        m2: '', retry: true
      },
      desconocido: {
        icon: 'i', title: 'Revisa tu correo',
        m1: 'No pudimos confirmar el estado de tu pago desde aquí. Si el pago se realizó, recibirás un comprobante de Flow en tu correo y tu pedido quedará registrado.',
        m2: 'Si tienes dudas, escríbenos con tu N° de pedido (si lo tienes).'
      }
    };
    const t = textos[estado];
    if (t) {
      $('icon').textContent = t.icon;
      $('title').textContent = t.title;
      $('msg1').textContent = t.m1;
      $('msg2').textContent = t.m2;
      $('msg2').hidden = !t.m2;
      if (t.retry) { $('backBtn').textContent = 'Intentar de nuevo'; $('backBtn').href = '/#comprar'; }
    }
    if (orderId) {
      $('orderId').textContent = orderId;
      $('orderBox').hidden = false;
    }
  </script>
</body>
</html>
