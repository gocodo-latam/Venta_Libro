<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preventa del libro</title>
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --ink: #2a2622;
    --muted: #6b645c;
    --accent: #8a5a3b;
    --accent-dark: #6e4630;
    --border: #e6ddd2;
    --error: #b3413a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
  }
  header p {
    color: var(--muted);
    margin: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .price-box {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .price-box .price {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--accent-dark);
  }
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .radio-group {
    display: flex;
    gap: 12px;
    margin-top: 6px;
  }
  .radio-option {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .radio-option.active {
    border-color: var(--accent);
    background: #fbf3ec;
  }
  .hint {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .pickup-details {
    background: #f6f1ea;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.9rem;
    margin-top: 10px;
    color: var(--ink);
  }
  .hidden { display: none !important; }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 1.1rem;
    font-weight: 600;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg {
    color: var(--error);
    font-size: 0.9rem;
    margin-top: 10px;
    display: none;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 24px;
  }
  .badge {
    display: inline-block;
    background: #fff3cd;
    color: #7a5b00;
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 6px;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="bookTitle">Preventa del libro</h1>
      <p>Reserva tu ejemplar y paga de forma segura con Flow.</p>
    </header>

    <div class="card">
      <div class="price-box">
        <span>Precio por ejemplar</span>
        <span class="price" id="unitPrice">—</span>
      </div>

      <form id="orderForm">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required />

        <label for="telefono">Teléfono (WhatsApp)</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required />

        <label for="cantidad">Cantidad de ejemplares</label>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1" required />

        <label>¿Cómo quieres recibir tu libro?</label>
        <div class="radio-group">
          <label class="radio-option active" id="optDespacho">
            <input type="radio" name="tipoEntrega" value="despacho" checked />
            Despacho a domicilio
          </label>
          <label class="radio-option" id="optRetiro">
            <input type="radio" name="tipoEntrega" value="retiro" />
            Retiro
          </label>
        </div>

        <div id="despachoFields">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" placeholder="Calle, número, depto/casa" />

          <label for="comuna">Comuna</label>
          <input type="text" id="comuna" name="comuna" />

          <label for="region">Región</label>
          <input type="text" id="region" name="region" />

          <p class="hint" id="despachoCostHint"></p>
        </div>

        <div id="retiroFields" class="hidden">
          <label for="puntoRetiro">Selecciona con quién retiras</label>
          <select id="puntoRetiro" name="puntoRetiro"></select>
          <div class="pickup-details" id="pickupDetails"></div>
        </div>

        <div class="total-row">
          <span>Total a pagar</span>
          <span id="totalAmount">—</span>
        </div>

        <p class="error-msg" id="errorMsg"></p>

        <button type="submit" id="payBtn">Pagar con Flow</button>
      </form>
    </div>

    <footer>Pago procesado de forma segura por Flow.cl</footer>
  </div>

<script>
  let cfg = null;

  const fmt = (n) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(n);

  async function loadConfig() {
    const res = await fetch('/api/config');
    cfg = await res.json();

    document.getElementById('bookTitle').textContent = cfg.book.title;
    document.getElementById('unitPrice').textContent = fmt(cfg.book.price);
    document.getElementById('despachoCostHint').textContent =
      cfg.shipping.despachoCost > 0
        ? `Costo de despacho: ${fmt(cfg.shipping.despachoCost)}`
        : 'Despacho sin costo adicional';

    const select = document.getElementById('puntoRetiro');
    select.innerHTML = '';
    cfg.pickupPoints.forEach((p) => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.label;
      select.appendChild(opt);
    });
    updatePickupDetails();
    updateTotal();
  }

  function updatePickupDetails() {
    const id = document.getElementById('puntoRetiro').value;
    const punto = cfg.pickupPoints.find((p) => p.id === id);
    document.getElementById('pickupDetails').textContent = punto ? punto.details : '';
  }

  function currentTipoEntrega() {
    return document.querySelector('input[name="tipoEntrega"]').closest ? null : null;
  }

  function getTipoEntrega() {
    const checked = document.querySelector('input[name="tipoEntrega"]:checked');
    return checked ? checked.value : 'despacho';
  }

  function updateTotal() {
    if (!cfg) return;
    const qty = parseInt(document.getElementById('cantidad').value, 10) || 0;
    const tipo = getTipoEntrega();
    const total = cfg.book.price * qty + (tipo === 'despacho' ? cfg.shipping.despachoCost : 0);
    document.getElementById('totalAmount').textContent = fmt(total);
  }

  function toggleEntregaFields() {
    const tipo = getTipoEntrega();
    document.getElementById('optDespacho').classList.toggle('active', tipo === 'despacho');
    document.getElementById('optRetiro').classList.toggle('active', tipo === 'retiro');
    document.getElementById('despachoFields').classList.toggle('hidden', tipo !== 'despacho');
    document.getElementById('retiroFields').classList.toggle('hidden', tipo !== 'retiro');
    updateTotal();
  }

  document.addEventListener('change', (e) => {
    if (e.target.name === 'tipoEntrega') toggleEntregaFields();
    if (e.target.id === 'cantidad') updateTotal();
    if (e.target.id === 'puntoRetiro') updatePickupDetails();
  });
  document.getElementById('cantidad').addEventListener('input', updateTotal);

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    const payBtn = document.getElementById('payBtn');
    payBtn.disabled = true;
    payBtn.textContent = 'Procesando...';

    const tipo = getTipoEntrega();
    const payload = {
      nombre: document.getElementById('nombre').value.trim(),
      email: document.getElementById('email').value.trim(),
      telefono: document.getElementById('telefono').value.trim(),
      cantidad: document.getElementById('cantidad').value,
      tipoEntrega: tipo,
      direccion: document.getElementById('direccion').value.trim(),
      comuna: document.getElementById('comuna').value.trim(),
      region: document.getElementById('region').value.trim(),
      puntoRetiro: document.getElementById('puntoRetiro').value
    };

    try {
      const res = await fetch('/api/crear-pedido', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'No se pudo crear el pedido');
      }

      window.location.href = `${data.url}?token=${data.token}`;
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      payBtn.disabled = false;
      payBtn.textContent = 'Pagar con Flow';
    }
  });

  loadConfig();
</script>
</body>
</html>
